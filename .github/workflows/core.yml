name: core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc-14
            cxx: g++-14
            build_type: Release
            conan_options: ""
          - name: Clang Debug
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            conan_options: ""
          - name: Clang ASan and UBSan
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            conan_options: -o "&:enable_asan=True" -o "&:enable_ubsan=True"
          - name: Clang TSan
            cc: clang-18
            cxx: clang++-18
            build_type: RelWithDebInfo
            conan_options: -o "&:enable_tsan=True"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.build_type }}
      # Report undefined behavior as a failure, not only as a message.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Detect the Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: >
          conan install . --build=missing
          -s build_type=${{ matrix.build_type }}
          -s compiler.cppstd=20
          ${{ matrix.conan_options }}

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$BUILD_DIR/generators/conan_toolchain.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build "$BUILD_DIR" -j "$(nproc)"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 600 -j 2
