name: core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc-14
            cxx: g++-14
            build_type: Release
            conan_options: ""
          - name: Clang Debug
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            conan_options: ""
          - name: Clang ASan and UBSan
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            conan_options: -o "&:enable_asan=True" -o "&:enable_ubsan=True"
          - name: Clang TSan
            cc: clang-18
            cxx: clang++-18
            build_type: RelWithDebInfo
            conan_options: -o "&:enable_tsan=True"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.build_type }}
      # Report undefined behavior as a failure, not only as a message.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      # Clang 18's sanitizers fail to map their shadow memory under the runner kernel's default of 32 random bits.
      - name: Fewer random bits for the sanitizers
        if: contains(matrix.conan_options, 'enable_')
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Detect the Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: >
          conan install . --build=missing
          -s build_type=${{ matrix.build_type }}
          -s compiler.cppstd=20
          ${{ matrix.conan_options }}

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$BUILD_DIR/generators/conan_toolchain.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build "$BUILD_DIR" -j "$(nproc)"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 600 -j 2

  fuzz:
    name: Fuzz the parser and the bytecode loader
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      BUILD_DIR: build/RelWithDebInfo
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Detect the Conan profile
        run: conan profile detect --force

      - name: Fewer random bits for the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Install dependencies
        run: >
          conan install . --build=missing
          -s build_type=RelWithDebInfo
          -s compiler.cppstd=20
          -o "&:build_fuzzers=True"

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$BUILD_DIR/generators/conan_toolchain.cmake"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build "$BUILD_DIR" -j "$(nproc)" --target fleaux fleaux_parser_fuzzer fleaux_bytecode_fuzzer

      # The samples, and the bytecode each compiles to. A sample is run to write its .fleaux.bc; what it prints, and
      # whether it ends well, does not matter here.
      - name: Make the corpora
        run: |
          mkdir -p fuzz-corpus/source fuzz-corpus/bytecode fuzz-artifacts
          cp ../samples/*.fleaux ../stdlib/Std.fleaux fuzz-corpus/source/
          for sample in fuzz-corpus/source/*.fleaux; do
            timeout 20 "$BUILD_DIR/bin/fleaux" "$sample" < /dev/null > /dev/null 2>&1 || true
          done
          mv fuzz-corpus/source/*.fleaux.bc fuzz-corpus/bytecode/ || true

      - name: Fuzz the parser
        run: >
          "$BUILD_DIR/bin/fleaux_parser_fuzzer" fuzz-corpus/source
          -max_total_time=60 -artifact_prefix=fuzz-artifacts/

      - name: Fuzz the bytecode loader
        run: >
          "$BUILD_DIR/bin/fleaux_bytecode_fuzzer" fuzz-corpus/bytecode
          -max_total_time=60 -artifact_prefix=fuzz-artifacts/

      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: core/fuzz-artifacts/
